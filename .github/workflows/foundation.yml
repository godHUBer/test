name: Application release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run inventory:dry-run
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm run release:manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-and-baseline-captures
          path: |
            playwright-report/
            test-results/
            .generated/release-manifest.json
          include-hidden-files: true # explicit manifest path only; never .local, .env or test TLS files
          retention-days: 7
